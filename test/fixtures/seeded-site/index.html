<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seeded site</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: sans-serif; margin: 0; color: #1a1a1a; background: #fff; }
  main { padding: 16px; }
  /* SEED 1: low-contrast button (#aaaaaa text on white is about 2.3:1) */
  .faint { background: #fff; color: #aaaaaa; border: 1px solid #ddd; padding: 12px 20px; min-height: 48px; }
  /* SEED 2: fixed-width box that overflows narrow screens */
  .wide { width: 600px; height: 40px; background: #cde; }
  /* SEED 3: one card with off-scale padding */
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card { padding: 24px; border: 1px solid #ccc; border-radius: 8px; }
  .card.odd { padding: 7px; }
  button, input { min-height: 48px; }
</style>
</head>
<body>
<header><nav><a href="/clean.html" style="display:inline-block;min-height:48px;min-width:48px">Clean page</a>
  <a href="/about.html" style="display:inline-block;min-height:48px;min-width:48px">About</a></nav></header>
<main>
  <h1>Seeded site</h1>

  <button class="faint" type="button" id="faint" onclick="document.title='x'">Low contrast</button>

  <div class="wide">Fixed 600px wide box</div>

  <section class="cards" aria-label="Cards">
    <div class="card">One</div>
    <div class="card">Two</div>
    <div class="card">Three</div>
    <div class="card odd">Four</div>
  </section>

  <p>
    <!-- SEED 4: broken link and placeholder link -->
    <a href="/missing.html" style="display:inline-block;min-height:48px">Broken page</a>
    <a href="#" style="display:inline-block;min-height:48px">Learn more</a>
    <!-- SEED 5: button with no handler -->
    <button type="button" id="dead">Do something</button>
  </p>

  <!-- SEED 6: form that double-submits, with no validation and no feedback -->
  <form id="bad-form">
    <label for="bad-email">Email</label>
    <input id="bad-email" name="email" type="text">
    <button type="submit">Subscribe</button>
  </form>
</main>
<script>
  document.getElementById("bad-form").addEventListener("submit", function (e) {
    e.preventDefault();
    fetch("/api/subscribe", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: this.email.value }) }).catch(function () {});
  });
</script>
</body>
</html>
